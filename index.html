  <head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/png" href="/favicon.png" />

    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />

    <!-- Apple PWA -->

    <!-- MS Tiles -->

    <!-- SEO + OG -->
    <meta name="description" content="Order authentic Ghanaian and Nigerian food from Cookers Delight. Fast delivery across Accra." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://cookers-delight.vercel.app/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cookers Delight" />
    <meta property="og:locale" content="en_GH" />
    <meta property="og:url" content="https://cookers-delight.vercel.app/" />
    <meta property="og:title" content="Cookers Delight | Authentic Ghanaian & Nigerian Food in Accra" />
    <meta property="og:description" content="Order authentic Ghanaian and Nigerian food from Cookers Delight. Fast delivery across Accra. Great Foods. Great People." />
    <meta property="og:image" content="https://cookers-delight.vercel.app/icons/icon-512x512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cookers Delight | Authentic Ghanaian & Nigerian Food in Accra" />
    <meta name="twitter:description" content="Order authentic Ghanaian and Nigerian food from Cookers Delight. Fast delivery across Accra." />
    <meta name="twitter:image" content="https://cookers-delight.vercel.app/icons/icon-512x512.png" />

    <!-- JSON-LD: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Cookers Delight",
      "url": "https://cookers-delight.vercel.app",
      "logo": "https://cookers-delight.vercel.app/icons/icon-512x512.png",
      "description": "Cookers Delight serves authentic Ghanaian and Nigerian food with fast delivery across Accra.",
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer service",
        "areaServed": "GH",
        "availableLanguage": "English"
      },
      "sameAs": []
    }
    </script>

    <!-- JSON-LD: Restaurant / LocalBusiness -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Restaurant",
      "name": "Cookers Delight",
      "url": "https://cookers-delight.vercel.app",
      "logo": "https://cookers-delight.vercel.app/icons/icon-512x512.png",
      "image": "https://cookers-delight.vercel.app/icons/icon-512x512.png",
      "description": "Authentic Ghanaian and Nigerian food with fast delivery across Accra. Dine in, take away, or order online.",
      "servesCuisine": ["Ghanaian", "Nigerian", "West African"],
      "priceRange": "$$",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Accra",
        "addressCountry": "GH"
      },
      "areaServed": {
        "@type": "City",
        "name": "Accra"
      },
      "hasMap": "https://maps.google.com/?q=Accra,Ghana",
      "openingHoursSpecification": [
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday"],
          "opens": "09:00",
          "closes": "22:00"
        },
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Saturday","Sunday"],
          "opens": "10:00",
          "closes": "23:00"
        }
      ],
      "menu": "https://cookers-delight.vercel.app/menu",
      "acceptsReservations": "True"
    }
    </script>

    <!-- JSON-LD: FAQ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Does Cookers Delight deliver food in Accra?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, Cookers Delight offers fast food delivery across Accra, Ghana. You can place your order online through our website or via the CD Boat app."
          }
        },
        {
          "@type": "Question",
          "name": "What type of food does Cookers Delight serve?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Cookers Delight specialises in authentic Ghanaian and Nigerian cuisine including jollof rice, fufu, waakye, egusi soup, pounded yam, and grilled meats."
          }
        },
        {
          "@type": "Question",
          "name": "Can I book a table at Cookers Delight?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, you can make a reservation online at cookers-delight.vercel.app/bookings or contact us directly."
          }
        },
        {
          "@type": "Question",
          "name": "Where are the Cookers Delight branches located?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Cookers Delight has multiple branches across Accra. Visit cookers-delight.vercel.app/branches for full addresses and directions."
          }
        },
        {
          "@type": "Question",
          "name": "How do I order food from Cookers Delight?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "You can order food from Cookers Delight by visiting our website, scanning the QR code at any of our tables, or using the CD Boat app. We accept online payments."
          }
        }
      ]
    }
    </script>
